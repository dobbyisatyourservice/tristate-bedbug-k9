[build]
  publish = "site"
  command = "python3 build.py"

# Serve the Google verification file as-is (no Pretty URL redirect)
[[redirects]]
  from = "/google343e4df1459b6631.html"
  to = "/google343e4df1459b6631.txt"
  status = 200
  force = true

[[redirects]]
  from = "/tri-state-bed-bug-k9-council-launches-nyc*"
  to = "/tri-state-bed-bug-k9-council-launches"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
